<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="LumaCue">
  <defs>
    <linearGradient id="lc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="lc-tile" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#1B1530"/>
      <stop offset="1" stop-color="#08070C"/>
    </radialGradient>
    <filter id="lc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#lc-tile)"/>
  <!-- Light-sweep arc: a cue travelling around the dancer -->
  <path d="M44 30 A64 64 0 0 1 108 94" fill="none" stroke="url(#lc-grad)" stroke-width="4" stroke-linecap="round" opacity="0.9" filter="url(#lc-glow)"/>
  <!-- The "L": a strip of LEDs -->
  <g fill="url(#lc-grad)" filter="url(#lc-glow)">
    <circle cx="44" cy="30" r="6"/>
    <circle cx="44" cy="46" r="6"/>
    <circle cx="44" cy="62" r="6"/>
    <circle cx="44" cy="78" r="6"/>
    <circle cx="44" cy="94" r="6"/>
    <circle cx="60" cy="94" r="6"/>
    <circle cx="76" cy="94" r="6"/>
    <circle cx="92" cy="94" r="6"/>
  </g>
  <!-- The cue point -->
  <circle cx="89.25" cy="48.75" r="5" fill="#FFFFFF" filter="url(#lc-glow)"/>
</svg>
