# Builds the LumaCue desktop app for Windows, Linux and macOS, and attaches the
# installers to a draft GitHub release. Trigger: push a tag like v0.2.0
# (or run it by hand from the Actions tab to just get the files as artifacts).
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lumacue } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: lumacue/package-lock.json }
      - run: npm ci
      - run: npm run check
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults: { run: { working-directory: lumacue } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: lumacue/package-lock.json }
      - run: npm ci
      - run: npm run build:standalone
      - name: Package installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned until signing certificates exist
      - uses: actions/upload-artifact@v4
        with:
          name: lumacue-${{ runner.os }}
          path: |
            lumacue/dist-desktop/*.exe
            lumacue/dist-desktop/*.deb
            lumacue/dist-desktop/*.AppImage
            lumacue/dist-desktop/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach installers to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: dist/*
